# ── MOOD 配置（GitHub Actions / 部署用）──
# DB ID 不是机密，可直接写在这里提交。
# 三个真正的机密（NOTION_TOKEN / DEEPSEEK_API_KEY / LINGMOU_GPT_API_KEY）
# 用 ${ENV} 占位，由 GitHub Secrets 注入；本地运行则从你的环境变量读取。

notion:
  token: "${NOTION_TOKEN}"
  entries_db: "766d7644-86a4-4e1c-91e5-b5efe205d257"
  entities_db: "0d399995-ac57-4fe2-b6f7-4fd1979eb449"
  letters_db: "0be076df-0f03-4124-a01e-85ff8199edf2"
  rules_db: "5c8598e2-f3ef-4098-87c6-36c188da2f70"
  # 可选：来信/日总结生成后，在该页发一条 @提及评论触发 Notion 通知。
  # 留空则自动识别工作区里唯一的真人；多人工作区请填自己的 user id。
  # notify_user_id: ""

classifier:
  provider: "openai"
  model: "deepseek-v4-flash"
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "https://api.deepseek.com"

responder:
  provider: "openai"
  model: "gpt-5.4-mini"
  api_key: "${LINGMOU_GPT_API_KEY}"
  base_url: "https://api.lmuai.com/v1"
  # 主模型重试失败后，用同一 key/端点依次尝试这些模型名
  # 注意：中转站的 model id 用「点号」（gpt-5.4），不是中划线（gpt-5-4）；
  # 名字有变时用 GET /v1/models 查真实 id。
  fallback_models:
    - "gpt-5.4"
    - "gpt-5.5"

letter:
  lookback_days: 7

# 周回顾（理性复盘卡，与来信分工：来信管陪伴，周回顾管模式与趋势）
weekly:
  lookback_days: 7
  # 喂给模型的记录总字数上限，超了从最早的开始丢，保证单次成本有界
  max_chars: 20000

# 月总结（月末那天生成，看一个月的主线与变化）
# 窗口固定为「自然月」，不可配——月总结的语义就是这个月，不是滚动 30 天。
monthly:
  # 一个月的记录本来就长，预算给得比周回顾宽；一个月只跑一次，这点支出可以接受。
  max_chars: 60000

memory:
  max_entries: 20
  max_chars: 6000

entities:
  enabled: true
